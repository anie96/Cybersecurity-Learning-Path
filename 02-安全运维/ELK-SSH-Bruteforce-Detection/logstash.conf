input {
  beats {
    port => 5044
  }
}

filter {
  if [fields][log_type] == "ssh-log" {
    # 只处理包含 sshd 或 sshd-session 的日志
    if "sshd" in [message] {
      grok {
        match => {
          "message" => "%{TIMESTAMP_ISO8601:timestamp} %{HOSTNAME:host} %{DATA:process}\[%{NUMBER:pid}\]: %{DATA:ssh_action} for (invalid user )?%{DATA:ssh_user} from %{IPV4:ssh_ip} port %{NUMBER:ssh_port}"
        }
      }
      mutate {
        gsub => [
          "ssh_action", "Failed", "failed",
          "ssh_action", "Accepted", "success"
        ]
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "ssh-log-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
